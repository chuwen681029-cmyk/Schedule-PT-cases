name: Deploy PT System

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Firebase config into index.html
        run: |
          sed -i \
            -e 's|YOUR_API_KEY|${{ secrets.FIREBASE_API_KEY }}|g' \
            -e 's|YOUR_PROJECT_ID\.firebaseapp\.com|${{ secrets.FIREBASE_PROJECT_ID }}.firebaseapp.com|g' \
            -e 's|YOUR_PROJECT_ID\.appspot\.com|${{ secrets.FIREBASE_PROJECT_ID }}.appspot.com|g' \
            -e 's|YOUR_PROJECT_ID|${{ secrets.FIREBASE_PROJECT_ID }}|g' \
            -e 's|YOUR_MESSAGING_SENDER_ID|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g' \
            -e 's|YOUR_APP_ID|${{ secrets.FIREBASE_APP_ID }}|g' \
            index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
