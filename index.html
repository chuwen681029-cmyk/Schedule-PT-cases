<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;background:#f1f5f9;color:#1e293b;min-height:100vh}

.header{background:#1d4ed8;color:#fff;padding:18px 0;box-shadow:0 2px 8px rgba(0,0,0,.2)}

.tab-bar{display:flex;gap:6px;background:#fff;padding:8px;border-radius:14px;border:1px solid #e2e8f0;margin-bottom:16px;overflow-x:auto}

.slot-input{width:72px;padding:6px 8px;text-align:center;border:1px solid #93c5fd;border-radius:8px;background:#eff6ff;color:#1d4ed8;font-size:13px;font-weight:700;outline:none;font-family:inherit}
.import-preview{border:1px solid #bfdbfe;border-radius:10px;overflow:hidden;margin-top:10px}
.preview-hdr{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#eff6ff;font-size:13px;font-weight:600;color:#1d4ed8;gap:8px;flex-wrap:wrap}
.save-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}

#app{display:none}
.vgap{display:flex;flex-direction:column;gap:14px}
.row-gap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.period-select{padding:7px 32px 7px 10px;border:1px solid #93c5fd;border-radius:8px;font-size:13px;font-weight:600;color:#1d4ed8;background:#eff6ff;outline:none;font-family:inherit;appearance:none;cursor:pointer}
.period-wrap{position:relative;display:inline-block}
.period-wrap::after{content:"▾";position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:#1d4ed8;font-size:11px}
.period-badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;background:#dbeafe;color:#1d4ed8;border:1px solid #bfdbfe}
/* 登入頁樣式 */
.login-box{max-width:360px;margin:60px auto;background:#fff;border-radius:16px;border:1px solid #e2e8f0;padding:32px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.login-icon{text-align:center;font-size:36px;margin-bottom:12px}
.login-title{font-size:17px;font-weight:700;color:#1e293b;margin-bottom:4px;text-align:center}
.login-sub{font-size:12px;color:#94a3b8;text-align:center;margin-bottom:24px}
.login-field{margin-bottom:14px}
.login-field label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:6px}
.login-field input{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px;outline:none;font-family:inherit;transition:.15s}
.login-field input:focus{border-color:#1d4ed8;box-shadow:0 0 0 3px #dbeafe}
.login-err{color:#dc2626;font-size:12px;text-align:center;margin-bottom:12px;min-height:18px}
.logout-btn{padding:5px 12px;border:1px solid #e2e8f0;border-radius:7px;background:#f8fafc;font-size:12px;cursor:pointer;color:#64748b;font-family:inherit}

<body>
<div id="loading">⏳ 連線至 Firebase 中...</div>
<div id="app"></div>

<script type="module">
import { initializeApp }        from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInAnonymously, onAuthStateChanged }
                                from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, onSnapshot, addDoc, deleteDoc,
         doc, serverTimestamp, query, orderBy, setDoc }
                                from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
  apiKey:            "YOUR_API_KEY",
  authDomain:        "YOUR_PROJECT_ID.firebaseapp.com",
  projectId:         "YOUR_PROJECT_ID",
  storageBucket:     "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
  appId:             "YOUR_APP_ID"
};
const APP_ID = 'pt-system-11504';

// ── 格數設定頁登入帳密（可在此修改）────────────────────────────────────
const SETTINGS_USER = 'Y00780';
const SETTINGS_PASS = '5323911';

const TB = [
  { id:'PD', name:'PD吳淑妮', amDept:'骨科', pmDept:'骨科' },
  { id:'PF', name:'PF葉秀逸', amDept:'骨科', pmDept:'骨科' },
  { id:'PG', name:'PG李敬恩', amDept:'神經', pmDept:'行政' },
  { id:'PH', name:'PH李佳紋', amDept:'床邊', pmDept:'神經' },
  { id:'PI', name:'PI徐瑄徽', amDept:'神經', pmDept:'骨科' },
  { id:'PJ', name:'PJ黃秋雯', amDept:'骨科', pmDept:'神經' },
  { id:'PP', name:'PP李政徹', amDept:'神經', pmDept:'床邊' },
  { id:'PU', name:'PU鄭堯仁', amDept:'神經', pmDept:'床邊' },
  { id:'PV', name:'PV劉明杰', amDept:'骨科', pmDept:'神經' },
  { id:'PA', name:'PA林佳億', amDept:'床邊', pmDept:'骨科' },
  { id:'P3', name:'P3吳泓儒', amDept:'骨科', pmDept:'神經' },
];
const DEF = {
  PD:{am:27,pm:27},PF:{am:25,pm:25},PG:{am:20,pm:0},
  PH:{am:0,pm:31}, PI:{am:28,pm:28},PJ:{am:27,pm:27},
  PP:{am:27,pm:0}, PU:{am:29,pm:0}, PV:{am:29,pm:29},
  PA:{am:0,pm:32}, P3:{am:32,pm:32}
};
const NC    = d => ['床邊','行政'].includes(d);
const today = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const mk    = dt => dt.substring(0,7);

const S = {
  tab:'new', date:today(),
  src:'門診', dept:'骨科', time:'上午', cpx:1, tid:'',
  assignments:[], slots:{}, slotsHistory:[],
  editSlots:{}, preview:null, importErr:'', importOk:'',
  saveOk:false, saving:false, submitting:false,
  summaryPeriod:'current', detailPeriod:'current',
  // 格數設定頁登入狀態（重新整理後需重新登入）
  settingsAuth:false, loginUser:'', loginPass:'', loginErr:'',
  lineIds:{}, lineIdsEdit:{}, lineIdsSaveOk:false, lineIdsSaving:false,
};

// ── 期間計算 ──────────────────────────────────────────────────────────
function getPeriods() {
  return [...S.slotsHistory]
    .sort((a,b)=>a.savedDate.localeCompare(b.savedDate))
    .map((p,i,arr)=>{
      const next=arr[i+1];
      return {
        monthKey:p.monthKey, savedDate:p.savedDate,
        startDate:p.savedDate,
        endDate:next?dateMinus1(next.savedDate):null,
        data:p.data,
        label:p.monthKey+'（'+p.savedDate+' 起）',
      };
    });
}
function dateMinus1(dateStr){
  const d=new Date(dateStr); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10);
}
function getPeriodForDate(dateStr){
  const periods=getPeriods(); if(!periods.length) return null;
  let result=null;
  for(const p of periods){ if(dateStr>=p.startDate) result=p; }
  return result;
}

// ── 治療師與統計 ──────────────────────────────────────────────────────
function therapistsForPeriod(period){
  const d=period?.data||null;
  return TB.map(t=>{ const s=d?.[t.id]||DEF[t.id]||{am:0,pm:0}; return{...t,baseAm:s.am??0,basePm:s.pm??0}; });
}
function assignmentsInPeriod(period){
  return S.assignments.filter(a=>a.dateStr>=period.startDate&&(!period.endDate||a.dateStr<=period.endDate));
}
function statsForPeriod(period){
  const th=therapistsForPeriod(period); const st={};
  th.forEach(t=>{st[t.id]={...t,amR:t.baseAm,pmR:t.basePm,today:0,out:0,inp:0,tot:0};});
  const list=period?assignmentsInPeriod(period):S.assignments;
  list.forEach(a=>{
    const t=st[a.therapistId]; if(!t) return;
    if(a.consumedTime==='上午') t.amR-=a.complexity;
    if(a.consumedTime==='下午') t.pmR-=a.complexity;
    if(a.dateStr===S.date) t.today++;
    if(a.source==='門診') t.out++; if(a.source==='住院') t.inp++; t.tot++;
  });
  return st;
}
function statsAllTime(){
  const periods=getPeriods(); const latest=periods.length?periods[periods.length-1]:null;
  const th=therapistsForPeriod(latest); const st={};
  th.forEach(t=>{st[t.id]={...t,amR:t.baseAm,pmR:t.basePm,today:0,out:0,inp:0,tot:0};});
  S.assignments.forEach(a=>{
    const t=st[a.therapistId]; if(!t) return;
    if(a.consumedTime==='上午') t.amR-=a.complexity;
    if(a.consumedTime==='下午') t.pmR-=a.complexity;
    if(a.dateStr===S.date) t.today++;
    if(a.source==='門診') t.out++; if(a.source==='住院') t.inp++; t.tot++;
  });
  return st;
}
const therapists=()=>therapistsForPeriod(getPeriodForDate(S.date));
const stats=()=>{
  const p=getPeriodForDate(S.date);
  if(!p){
    const th=therapistsForPeriod(null); const st={};
    th.forEach(t=>{st[t.id]={...t,amR:t.baseAm,pmR:t.basePm,today:0,out:0,inp:0,tot:0};});
    S.assignments.forEach(a=>{
      const t=st[a.therapistId]; if(!t) return;
      if(a.consumedTime==='上午') t.amR-=a.complexity;
      if(a.consumedTime==='下午') t.pmR-=a.complexity;
      if(a.dateStr===S.date) t.today++;
      if(a.source==='門診') t.out++; if(a.source==='住院') t.inp++; t.tot++;
    });
    return st;
  }
  return statsForPeriod(p);
};
const validList=()=>{
  const st=stats();
  return therapists().flatMap(t=>{
    const ts=st[t.id]; let match=false,rem=0,ct='';
    if(S.src==='住院'){
      const mA=t.amDept===S.dept,mP=t.pmDept===S.dept;
      if(mA&&mP){match=true;if(ts.amR>=ts.pmR){rem=ts.amR;ct='上午';}else{rem=ts.pmR;ct='下午';}}
      else if(mA){match=true;rem=ts.amR;ct='上午';}
      else if(mP){match=true;rem=ts.pmR;ct='下午';}
    }else{
      if(S.time==='上午'&&t.amDept===S.dept){match=true;rem=ts.amR;ct='上午';}
      else if(S.time==='下午'&&t.pmDept===S.dept){match=true;rem=ts.pmR;ct='下午';}
    }
    return match?[{...t,rem,ct,disabled:ts.today>=3}]:[];
  }).sort((a,b)=>b.rem-a.rem);
};

// ── Firebase ──────────────────────────────────────────────────────────
const fbApp=initializeApp(firebaseConfig);
const auth=getAuth(fbApp); const db=getFirestore(fbApp);
const aCol=()=>collection(db,'artifacts',APP_ID,'public','data','assignments');
const sCol=()=>collection(db,'artifacts',APP_ID,'public','data','monthlySlots');
const hCol=()=>collection(db,'artifacts',APP_ID,'public','data','slotsHistory');
const lCol=()=>collection(db,'artifacts',APP_ID,'public','data','lineIds');

signInAnonymously(auth).catch(console.error);
onAuthStateChanged(auth,user=>{
  if(!user) return;
  onSnapshot(query(aCol(),orderBy('createdAt','desc')),snap=>{
    S.assignments=snap.docs.map(d=>({id:d.id,...d.data()})); render();
  });
  onSnapshot(sCol(),snap=>{
    S.slots={}; snap.docs.forEach(d=>S.slots[d.id]=d.data()); render();
  });
  onSnapshot(query(hCol(),orderBy('savedDate','asc')),snap=>{
    S.slotsHistory=snap.docs.map(d=>({id:d.id,...d.data()})); render();
  });
  // 監聽治療師 LINE ID
  onSnapshot(lCol(),snap=>{
    S.lineIds={};
    snap.docs.forEach(d=>{ S.lineIds[d.id]=d.data().lineId||''; });
    render();
  });
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='block';
});

// ── Actions ───────────────────────────────────────────────────────────
// ── Make Webhook URL（LINE 通知）────────────────────────────────────
const MAKE_WEBHOOK_URL = 'https://hook.us2.make.com/5unjuqa573p15bc7pffit7h25pe6te6k';

// ── 治療師 LINE ID 對照表（直接寫在程式碼，日後如需修改請更新此處）──
const THERAPIST_LINE_IDS = {
  PJ: 'Ubb332be974ac73e7324d8694db3d0da5', // PJ黃秋雯
  // 其他治療師加好友後填入：
  // PD: 'U...', PF: 'U...', PG: 'U...', PH: 'U...',
  // PI: 'U...', PP: 'U...', PU: 'U...', PV: 'U...',
  // PA: 'U...', P3: 'U...',
};

function sendLineNotify(data) {
  // 完全非同步，絕不影響派案作業
  try {
    const lineId = THERAPIST_LINE_IDS[data.therapistId] || '';
    if (!lineId) return; // 沒有設定 LINE ID 就略過
    fetch(MAKE_WEBHOOK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        therapistName: data.therapistName || '',
        dateStr:       data.dateStr       || '',
        source:        data.source        || '',
        department:    data.department    || '',
        time:          data.time          || '',
        complexity:    data.complexity    || '',
      })
    }).catch(e => console.log('LINE notify failed:', e));
  } catch(e) {
    console.log('LINE notify error:', e);
  }
}

async function submit(){
  if(!S.tid||S.submitting) return;
  const vl=validList(); const sel=vl.find(t=>t.id===S.tid); if(!sel) return;
  // 先記錄要通知的資料（submit 前確保資料正確）
  const notifyData = {
    dateStr:    S.date,
    source:     S.src,
    department: S.dept,
    time:       S.src==='住院'?'不限':S.time,
    complexity: S.cpx,
    therapistId:   S.tid,
    therapistName: sel.name,
  };
  S.submitting=true; render();
  try{
    await addDoc(aCol(),{
      ...notifyData,
      consumedTime:sel.ct,
      createdAt:serverTimestamp()
    });
    S.cpx=1;
  }catch(e){console.error(e);}
  S.submitting=false; render();
  // LINE 通知完全獨立，不阻擋派案
  setTimeout(()=>sendLineNotify(notifyData), 0);
}
async function del(id){
  try{
    await deleteDoc(doc(db,'artifacts',APP_ID,'public','data','assignments',id));
  }catch(e){console.error(e);}
}
async function saveSlots(){
  if(S.saving) return; S.saving=true; render();
  const m=mk(S.date), savedDate=today(), data={};
  TB.forEach(t=>{data[t.id]={am:S.editSlots[t.id]?.am??0,pm:S.editSlots[t.id]?.pm??0};});
  try{
    await setDoc(doc(db,'artifacts',APP_ID,'public','data','monthlySlots',m),data);

// ── File Import ───────────────────────────────────────────────────────
function handleFile(e){
  const file=e.target.files[0]; if(!file) return;
  S.importErr=''; S.importOk=''; S.preview=null;
  const ext=file.name.split('.').pop().toLowerCase();
  const reader=new FileReader();
  reader.onload=evt=>{
    let rows=[];
    try{
      if(ext==='csv'){
        let txt=evt.target.result; if(txt.charCodeAt(0)===0xFEFF) txt=txt.slice(1);
        const lines=txt.split(/\r?\n/).filter(l=>l.trim());
        const hdrs=lines[0].split(',').map(h=>h.replace(/^"|"$/g,'').trim());
        for(let i=1;i<lines.length;i++){const vals=lines[i].split(',').map(v=>v.replace(/^"|"$/g,'').trim());const row={};hdrs.forEach((h,j)=>row[h]=vals[j]??'');rows.push(row);}
      }else{const wb=XLSX.read(new Uint8Array(evt.target.result),{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});}
    }catch(err){S.importErr='無法解析檔案：'+err.message;render();return;}
    if(!rows.length){S.importErr='檔案內無資料。';render();return;}
    const hdrs=Object.keys(rows[0]);
    const fk=ks=>hdrs.find(h=>ks.map(k=>k.toLowerCase()).includes(h.toLowerCase().trim()));
    const cId=fk(['治療師id','治療師ID','id','ID','代碼','代號']);
    const cAm=fk(['上午格數','上午','am','baseam','AM格數','上午格']);
    const cPm=fk(['下午格數','下午','pm','basepm','PM格數','下午格']);
    if(!cId||!cAm||!cPm){S.importErr=`找不到必要欄位，需有：治療師ID、上午格數、下午格數\n現有欄位：${hdrs.join('、')}`;render();return;}
    const vIds=new Set(TB.map(t=>t.id)); const preview=[],errs=[];
    rows.forEach((row,i)=>{
      const tid=String(row[cId]||'').trim(); if(!tid) return;
      const am=parseInt(row[cAm]),pm=parseInt(row[cPm]);
      if(!vIds.has(tid)){errs.push(`第${i+2}行：找不到治療師「${tid}」`);return;}
      if(isNaN(am)||isNaN(pm)){errs.push(`第${i+2}行(${tid})：格數格式錯誤`);return;}
      preview.push({id:tid,name:TB.find(t=>t.id===tid)?.name||tid,am,pm});
    });
    if(errs.length){S.importErr=errs.join('\n');render();return;}
    if(!preview.length){S.importErr='沒有匹配的治療師資料。';render();return;}
    S.preview=preview; render();
  };
  if(ext==='csv') reader.readAsText(file,'UTF-8'); else reader.readAsArrayBuffer(file);
  e.target.value='';
}
function confirmImport(){
  if(!S.preview) return;
  S.preview.forEach(r=>{S.editSlots[r.id]={am:r.am,pm:r.pm};});
  S.importOk=`成功匯入 ${S.preview.length} 筆，請按「儲存至 Firebase」確認生效。`;
  S.preview=null; render();
}

// ── Export ────────────────────────────────────────────────────────────
function dlCSV(name,rows,suffix){
  if(!rows.length) return;
  let csv='\uFEFF'+Object.keys(rows[0]).join(',')+'\n';
  rows.forEach(r=>{csv+=Object.values(r).map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')+'\n';});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download=name+(suffix?'_'+suffix:'')+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function dlXLSX(name,rows,suffix){
  if(!rows.length) return;
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Sheet1');
  XLSX.writeFile(wb,name+(suffix?'_'+suffix:'')+'.xlsx');
}
function getSummaryRows(period){
  const th=therapistsForPeriod(period);
  const st=period?statsForPeriod(period):statsAllTime();
  return th.map(t=>{const s=st[t.id];return{治療師:t.name,上午科別:t.amDept,下午科別:t.pmDept,
    上午剩餘:NC(t.amDept)?'N/A':s.amR,上午總格:NC(t.amDept)?'N/A':t.baseAm,
    下午剩餘:NC(t.pmDept)?'N/A':s.pmR,下午總格:NC(t.pmDept)?'N/A':t.basePm,
    門診:s.out,住院:s.inp,合計:s.tot};});
}
function getDetailRows(period){
  const list=period?assignmentsInPeriod(period):S.assignments;
  return list.map(a=>({日期:a.dateStr,來源:a.source,科別:a.department,
    時段:a.time==='不限'?`不限(扣${a.consumedTime})`:a.time,治療師:a.therapistName,格數:a.complexity}));
}
function dlTemplate(){
  const cur=S.slots[mk(S.date)]||{};
  const rows=TB.map(t=>{const s=cur[t.id];return{
    '治療師ID':t.id,'姓名':t.name,

  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'格數設定');
  XLSX.writeFile(wb,`格數設定模板_${mk(S.date)}.xlsx`);

        </div>

      <div class="notice ${hasData?'n-green':'n-amber'}">${hasData?'✅ '+m+' 已有格數設定':'⚠️ '+m+' 目前使用預設格數'}</div>
      <div class="notice n-blue" style="font-size:12px">💡 儲存的當天將自動成為新期間的起始日，總表與明細可依期間分別查詢與匯出。</div>
    </div>
    <div class="card"><div class="card-title">📤 整批匯入格數（Excel / CSV）</div>
      <div class="howto"><strong>使用方式：</strong><ol>
        <li>下載模板 → 填入各治療師上午/下午格數</li>
        <li>上傳檔案 → 確認預覽 → 按「確認套用」</li>
        <li>按「儲存至 Firebase」同步所有裝置</li>
      </ol><p>支援欄位名稱：<code>治療師ID</code>、<code>上午格數</code>、<code>下午格數</code></p></div>
      <div class="row-gap" style="margin-bottom:10px">
        <button class="btn-outline" data-a="dl-tpl">📥 下載 Excel 模板</button>
        <button class="btn-primary" style="width:auto;padding:8px 16px" data-a="upload">📂 上傳 Excel / CSV</button>
        <input id="fi" type="file" accept=".xlsx,.xls,.csv" style="display:none">
      </div>
      ${S.importErr?`<div class="notice n-red" style="white-space:pre-line">❌ ${S.importErr}</div>`:''}
      ${S.importOk?`<div class="notice n-green">✅ ${S.importOk}</div>`:''}
      ${pvHtml}
    </div>
    <div class="card"><div class="card-title">✏️ 手動調整格數</div>
      <div class="table-wrap" style="margin-top:10px"><table>
        <thead><tr><th>治療師</th><th>上午科別</th><th>下午科別</th><th>上午格數</th><th>下午格數</th></tr></thead>
        <tbody>${tRows}</tbody>
      </table></div>
      <div class="save-row">
        <button class="btn-primary" style="width:auto;padding:10px 24px" data-a="save" ${S.saving?'disabled':''}>
          ${S.saving?'⏳ 儲存中...':'💾 儲存 '+m+' 至 Firebase'}
        </button>
        ${S.saveOk?'<span class="save-ok">✅ 儲存成功！已同步所有裝置</span>':''}
        <span class="c-muted">儲存後所有裝置立即生效，並記錄為新期間起始日</span>
      </div>
    </div>
    ${histHtml}
  </div>`;
}

function renderLineIds(){
  // 未登入 → 顯示登入頁
  if(!S.settingsAuth) return renderSettingsLogin();

  const rows = TB.map(t=>{
    const val = S.lineIdsEdit[t.id]||'';
    const saved = S.lineIds[t.id]||'';
    return `<tr>
      <td><strong>${t.name}</strong></td>
      <td class="c-muted">${t.amDept}/${t.pmDept}</td>
      <td>
        <input type="text" data-lid="${t.id}" value="${val}"
          placeholder="U開頭的LINE User ID"
          style="width:100%;padding:6px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:12px;outline:none;font-family:inherit"
          onfocus="this.style.borderColor='#1d4ed8'"
          onblur="this.style.borderColor='#cbd5e1'">
      </td>
      <td>${saved
        ? '<span style=\"color:#15803d;font-size:11px\">✅ 已設定</span>'
        : '<span style=\"color:#94a3b8;font-size:11px\">未設定</span>'}</td>
    </tr>`;
  }).join('');

  return `<div class="vgap">
    <div class="card">
      <div class="card-header">
        <div class="card-title">📱 治療師 LINE ID 設定</div>
        <button class="logout-btn" data-a="logout">登出</button>
      </div>
      <div class="notice n-blue" style="font-size:12px">
        💡 每位治療師需先加 <strong>YLH-PT（@796wzzsw）</strong> 為好友，才能收到推播。<br>
        LINE User ID 請至 LINE Developers Console → Basic settings → Your user ID 取得。
      </div>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>治療師</th><th>科別</th><th>LINE User ID</th><th>狀態</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="save-row">
        <button class="btn-primary" style="width:auto;padding:10px 24px" data-a="save-lineids" ${S.lineIdsSaving?'disabled':''}>
          ${S.lineIdsSaving?'⏳ 儲存中...':'💾 儲存 LINE ID 設定'}
        </button>
        ${S.lineIdsSaveOk?'<span class="save-ok">✅ 儲存成功！</span>':''}
        <span class="c-muted">儲存後派案時自動推播 LINE 通知</span>
      </div>
    </div>
  </div>`;
}

function render(){
  const tabs=[
    {id:'new',label:'➕ 新增派案'},
    {id:'summary',label:'👥 總表'},
    {id:'details',label:'📋 全部明細'},
    {id:'settings',label:'⚙️ 月份格數設定'},
    {id:'lineids',label:'📱 LINE ID 設定'},
  ];
  let content='';
  if(S.tab==='new')      content=renderNew();
  if(S.tab==='summary')  content=renderSummary();
  if(S.tab==='details')  content=renderDetails();
  if(S.tab==='settings') content=renderSettings();
  if(S.tab==='lineids')  content=renderLineIds();
  document.getElementById('app').innerHTML=`
    <header class="header"><div class="container"><h1 class="h1">⚡ 物理治療排個案系統</h1></div></header>
    <div class="container" style="padding-top:20px;padding-bottom:40px">
      <div class="tab-bar">${tabs.map(t=>`<button class="tab-btn${S.tab===t.id?' active':''}" data-a="tab" data-v="${t.id}">${t.label}</button>`).join('')}</div>
      ${content}
    </div>`;
}
</script>
</body>
</html>
